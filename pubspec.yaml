name: city_guide_app
description: A City Guide mobile app for residents and tourists.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter 
  flutter_map: ^6.1.0        
  latlong2: ^0.9.0  
  geolocator: ^10.1.0
  # url_launcher: ^6.2.4
  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.3
  flutter_map_marker_cluster: ^1.0.0 

  # State Management (choose one or remove if not needed)
  provider: ^6.1.2
  # or riverpod: ^2.5.1

  # Local Storage
  shared_preferences: ^2.3.2

  # Image Picker
  image_picker: ^1.1.2

  # Connectivity
  connectivity_plus: ^6.1.0

  # UI & Utilities
  flutter_svg: ^2.0.10+1 # for SVG icons if needed
  intl: ^0.19.0 # for date formatting
  url_launcher: ^6.3.0 # for opening URLs

  # Routing
  go_router: ^14.3.0 # optional, if you prefer declarative routing


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Assets (add your own images/icons)
  # assets:
  #   - assets/images/
  #   - assets/icons/

  # Fonts (if custom fonts)
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf
