name: city_guide_app
description: A City Guide mobile app for residents and tourists.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter 
  flutter_map: ^8.2.2        
  latlong2: ^0.9.0  
  geolocator: ^14.0.2
  # url_launcher: ^6.2.4
  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6
  flutter_map_marker_cluster: ^8.2.2 
  flutter_map_marker_popup: ^8.1.0

  # State Management (choose one or remove if not needed)
  provider: ^6.1.2
  # or riverpod: ^2.5.1

  # Local Storage
  shared_preferences: ^2.3.2

  # Image Picker
  image_picker: ^1.1.2
  http: ^1.6.0

  path_provider: ^2.1.2

  flutter_image_compress: ^2.3.0

  # Connectivity
  connectivity_plus: ^7.0.0

  # UI & Utilities
  flutter_svg: ^2.0.10+1 # for SVG icons if needed
  intl: ^0.20.2 # for date formatting
  url_launcher: ^6.3.0 # for opening URLs

  # Routing
  go_router: ^17.1.0 # optional, if you prefer declarative routing


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Assets (add your own images/icons)
  # assets:
  #   - assets/images/
  #   - assets/icons/

  # Fonts (if custom fonts)
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf
